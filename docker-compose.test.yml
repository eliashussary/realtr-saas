services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realtr_test
      POSTGRES_PASSWORD: realtr_test
      POSTGRES_DB: realtr_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtr_test -d realtr_test"]
      interval: 1s
      timeout: 3s
      retries: 20
