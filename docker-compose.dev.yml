# Local development: Postgres + SeaweedFS (a lightweight, widely-used S3-compatible store — the same
# S3 code path as production). Apps + worker run on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: realtr-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: realtr
      POSTGRES_PASSWORD: realtr
      POSTGRES_DB: realtr
    ports:
      # Host 5433 -> container 5432 (5432 is commonly taken by other local DBs).
      - "5433:5432"
    volumes:
      - realtr_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtr -d realtr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for uploaded assets. Signed writes use the `realtr` identity;
  # anonymous read lets tenant sites load images directly. S3 API on host 9002 (9000 is often taken).
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: realtr-dev-s3
    restart: unless-stopped
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip=0.0.0.0
    ports:
      - "9002:8333"
    volumes:
      - realtr_dev_s3:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  realtr_dev_pgdata:
  realtr_dev_s3:
