packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@biomejs/biome": true
  esbuild: true

# Shared version pins so every workspace package agrees. Reference with `catalog:`
# in a package.json dependency (e.g. "zod": "catalog:").
catalog:
  # Core
  typescript: ^5.7.3
  "@types/node": ^22.10.0
  zod: ^3.24.1

  # Data
  drizzle-orm: ^0.38.3
  drizzle-kit: ^0.30.1
  pg: ^8.13.1
  "@types/pg": ^8.11.10
  pg-boss: ^10.1.5
  vitest: ^3.2.4

  # Auth
  better-auth: ^1.1.0

  # Billing
  stripe: ^17.7.0

  # Editor / UI
  "@measured/puck": ^0.18.2
  tailwindcss: ^4.0.0
  "@tailwindcss/vite": ^4.0.0
